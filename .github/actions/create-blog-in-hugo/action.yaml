name: "Publish Blog"
description: "Create a new Hugo blog and push it to the target repo"
inputs:
  onepass-token:
    description: "A access-token for 1password authorsation"
    required: true
  release-subject:
    description: "The Title of Blog"
    required: true
  release-body:
    description: "The content that is showing in the blog"
    required: true
  release-url:
    description: "The URL links to a original website"
    required: true
  python-version:
    description: "Python Version"
    required: true
    default: "3.11"
  project-name:
    description: "Project Name"
    required: true
  hero-image:
    description: "The Path of Image/Background"
    required: false
    default: "/images/posts/hero/project-release.jpeg"
  github-token-path:
    description: "1Password Secret Path of GitHub PAT"
    required: false
    default: "op://DevOps/Git PAT - Personal - GitHub Action/credential"
  kubernetes-mode:
    description: "enable kubernetes mode, meaning that this action run on a host with ARC kubernetes mode"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup 1Password
      uses: stone-home/Action-Stone-DevOps/.github/actions/setup-1password@trunk
      with:
        onepass-token: ${{ inputs.onepass-token }}
        kubernetes-mode: ${{ inputs.kubernetes-mode }}

    - name: Get Personal Token
      id: get-token
      uses: stone-home/Action-Stone-DevOps/.github/actions/load-github-token@trunk
      with:
        secret-path: ${{ inputs.github-token-path }}
        kubernetes-mode: ${{ inputs.kubernetes-mode }}
        onepass-token: ${{ inputs.onepass-token }}

    - name: Install system dependencies
      shell: bash
      if: ${{ inputs.kubernetes-mode == 'true' }}
      run: |
        apt-get update
        apt-get install -y git

    - name: Checkout target repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: stonebo/stone-journey.github.io
        token: ${{ steps.get-token.outputs.token }}
        path: hugo_blog
        ref: trunk

    # Public repo: the job's own token is enough, so the PAT is not used here.
    - name: Checkout DevOps repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: stone-home/Action-Stone-DevOps
        path: devops_repo
        ref: trunk
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ures==3.2.1

    # Release text is untrusted input (it is built from commit titles). It is
    # passed through env and read as "$VAR", never expanded into the script, so
    # backticks or $(...) in a release note are plain text. The --name=value
    # form keeps a value that starts with "-" from being read as another flag.
    - name: Generate a new blog
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        RELEASE_SUBJECT: ${{ inputs.release-subject }}
        RELEASE_BODY: ${{ inputs.release-body }}
        RELEASE_URL: ${{ inputs.release-url }}
        HERO_IMAGE: ${{ inputs.hero-image }}
      run: |
        python devops_repo/scripts/release_blog.py \
          --project="$PROJECT_NAME" \
          --version="$RELEASE_SUBJECT" \
          --notes="$RELEASE_BODY" \
          --url="$RELEASE_URL" \
          --output-dir="hugo_blog" \
          --hero="$HERO_IMAGE"

    - name: Commit changes
      shell: bash
      run: |
        cd hugo_blog
        pwd
        ls -al
        git config --global user.email "github@stone-bo.com"
        git config --global user.name "Blog Creation Bot"
        git add ./content/posts/project
        git commit -m "docs(project): add new blog for ${RELEASE_SUBJECT} of ${PROJECT_NAME}"
        git push
      env:
        GITHUB_TOKEN: ${{ steps.get-token.outputs.token }}
        PROJECT_NAME: ${{ inputs.project-name }}
        RELEASE_SUBJECT: ${{ inputs.release-subject }}
