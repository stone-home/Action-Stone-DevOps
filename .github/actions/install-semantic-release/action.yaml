name: "Install Semantic Release Deps and Run it"
description: "Install Semantic Release Deps and Run it"

runs:
  using: "composite"
  steps:
    - name: Install pinned semantic-release toolchain
      shell: bash
      run: |
        npm install --no-save \
          semantic-release@25.0.9 \
          @semantic-release/exec@7.1.0 \
          @semantic-release/git@11.0.1 \
          @semantic-release/github@12.0.10 \
          @semantic-release/changelog@7.0.0 \
          @semantic-release/npm@13.2.0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pinned ures
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ures==3.1.0
