name: "Install Semantic Release Deps and Run it"
description: "Install Semantic Release Deps and Run it"

runs:
  using: "composite"
  steps:
    - name: Install pinned semantic-release toolchain
      if: ${{ inputs.use-unified-version == 'true' }}
      shell: bash
      run: |
        npm install --no-save \
          semantic-release@25.0.9 \
          @semantic-release/exec@7.1.0 \
          @semantic-release/git@11.0.1 \
          @semantic-release/changelog@7.0.0 \
          "@semantic-release/npm": "^13.1.3" \
    
