name: Docker Build and Push
description: "Build and push with Docker (hosted) or Kaniko in a separate step pod (ARC kubernetes-mode, no Docker socket)"

# kubernetes-mode: Kaniko only works in its official image (it unpacks the base
# image over its own root and keeps what was already there, and its multi-stage
# wipe deletes logins under /tmp). So the job container only fetches the token
# (needs bash, git, op, curl, jq, e.g. stonebo/arc-runner:docker-builder) and
# Kaniko runs as a docker:// step, which the ARC kubernetes hook starts as a
# separate pod with the workspace copied to /github/workspace.
#
# The Kaniko script is scripts/docker/kaniko-build.sh in this repo. It is
# cloned to .devops inside the workspace, so the step pod gets it with the
# workspace copy.

inputs:
  registry:
    description: "Target registry: 'ghcr' or 'dockerhub'"
    required: false
    default: "ghcr"
  registry-username:
    description: "Registry username"
    required: false
    default: ""
  registry-password-path:
    description: "1Password secret path for registry token"
    required: false
    default: "op://DevOps/Docker PAT - Git Action/credential"
  onepass-token:
    description: "OnePassword service account token"
    required: true
  kubernetes-mode:
    description: "true = Kaniko in a separate step pod (no Docker). Job container needs bash, git, op, curl, jq"
    required: false
    default: "false"
  image-name:
    description: "Full image ref without tag (e.g. ghcr.io/owner/repo)."
    required: false
    default: ""
  dockerfile:
    description: "Dockerfile path relative to repo root"
    required: false
    default: "Dockerfile"
  context:
    description: "Build context path relative to repo root"
    required: false
    default: "."
  tags:
    description: "Comma-separated tag suffixes (e.g. latest,v1.0.0)"
    required: false
    default: "latest"
  git-clone:
    description: "kubernetes-mode only: check out the triggering commit with plain git (actions/checkout's post step fails there with fcntl64). false = the caller checks out"
    required: false
    default: "true"

outputs:
  digest:
    description: "Manifest digest of the first tag right after the push (sha256:...)"
    value: ${{ steps.build.outputs.digest || steps.digest.outputs.digest }}

# ===========================================================================
# Required Permission
# contents: read (checkout)
# packages: write (push to GHCR)
# ===========================================================================

runs:
  using: composite
  steps:
    # The fnctl64 missing issue occurs in kubernetes mode only (at least in my case)
    # Works on a non-empty workspace (origin is reset, the tree is forced and
    # cleaned). The token is passed only for the fetch, never written to
    # .git/config: the workspace is the build context, so a COPY . . would put
    # it in the image.
    - name: Native Git Checkout (avoids fnctl64 missing issue in post checkout steps)
      if: inputs.kubernetes-mode == 'true' && inputs.git-clone == 'true'
      shell: bash
      env:
        GIT_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git init -q
        git remote remove origin 2>/dev/null || true
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')
        echo "::add-mask::${auth}"
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
          fetch -q --depth 1 origin "$GITHUB_SHA"
        git checkout -q --force --detach FETCH_HEAD
        git clean -ffdxq
        git log -1 --format="Checked out commit: %H"

    # After the checkout above, whose git clean would delete it. Plain git:
    # actions/checkout's post step fails in ARC job containers (fcntl64).
    # Public repo, so no token.
    - name: Checkout DevOps repository
      if: inputs.kubernetes-mode == 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$GITHUB_WORKSPACE/.devops"
        git clone -q --depth 1 --branch trunk https://github.com/stone-home/Action-Stone-DevOps.git "$GITHUB_WORKSPACE/.devops"

    - name: Set image name and tags
      id: image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        IMAGE_NAME: ${{ inputs.image-name }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        if [ -z "$REGISTRY_USER" ]; then
          echo "::error::registry-username is required"
          exit 1
        fi
        name="$IMAGE_NAME"
        if [ -z "$name" ] && [ "$REGISTRY" = "ghcr" ]; then
          name="ghcr.io/${GITHUB_REPOSITORY}"
        fi
        if [ -z "$name" ]; then
          echo "::error::image-name is required for registry=${REGISTRY}"
          exit 1
        fi
        if [ "$REGISTRY" = "ghcr" ]; then
          name=$(echo "$name" | tr '[:upper:]' '[:lower:]')
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        tags_full=""
        IFS=',' read -ra TARR <<< "$TAGS"
        for t in "${TARR[@]}"; do
          t=$(echo "$t" | xargs)
          [ -z "$t" ] && continue
          tags_full="${tags_full}${name}:${t},"
        done
        tags_full="${tags_full%,}"
        [ -z "$tags_full" ] && tags_full="${name}:latest"
        echo "tags=${tags_full}" >> "$GITHUB_OUTPUT"

    - name: Setup 1Password
      uses: stone-home/Action-Stone-DevOps/.github/actions/setup-1password@trunk
      with:
        onepass-token: ${{ inputs.onepass-token }}
        kubernetes-mode: ${{ inputs.kubernetes-mode }}

    - name: Get Registry token
      id: get-registry-token
      uses: stone-home/Action-Stone-DevOps/.github/actions/load-github-token@trunk
      with:
        secret-path: ${{ inputs.registry-password-path }}
        kubernetes-mode: ${{ inputs.kubernetes-mode }}
        onepass-token: ${{ inputs.onepass-token }}

    # ---------------- Docker (hosted runners) ----------------
    - name: Log in to GitHub Container Registry
      if: inputs.registry == 'ghcr' && inputs.kubernetes-mode != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ steps.get-registry-token.outputs.token }}

    - name: Log in to Docker Hub
      if: inputs.registry == 'dockerhub' && inputs.kubernetes-mode != 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ steps.get-registry-token.outputs.token }}

    - name: Build and push Docker image
      id: build
      if: inputs.kubernetes-mode != 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.image.outputs.tags }}

    # ---------------- Kaniko (ARC kubernetes-mode) ----------------
    # v1.24.0 is the last upstream release (2025-05-23).
    - name: Build and push (Kaniko step pod)
      if: inputs.kubernetes-mode == 'true'
      uses: docker://gcr.io/kaniko-project/executor:v1.24.0-debug
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ steps.get-registry-token.outputs.token }}
        BUILD_TAGS_FULL: ${{ steps.image.outputs.tags }}
        BUILD_CONTEXT: ${{ inputs.context }}
        BUILD_DOCKERFILE: ${{ inputs.dockerfile }}
      with:
        entrypoint: /busybox/sh
        args: /github/workspace/.devops/scripts/docker/kaniko-build.sh

    # Read from the registry (not Kaniko's --digest-file): the step pod gets a
    # copy of the workspace, so files it writes never come back. Use the digest
    # to run the image in later jobs: ARC job pods pull IfNotPresent, so a tag
    # can hit an older image cached on the node.
    - name: Resolve pushed digest
      id: digest
      if: inputs.kubernetes-mode == 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ steps.get-registry-token.outputs.token }}
        BUILD_TAGS_FULL: ${{ steps.image.outputs.tags }}
      run: |
        set -euo pipefail
        ref=$(cut -d, -f1 <<<"$BUILD_TAGS_FULL" | tr -d '[:space:]')
        name="${ref%:*}" tag="${ref##*:}"
        if [ "$REGISTRY" = "ghcr" ]; then
          repo="${name#ghcr.io/}"
          auth="https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull"
          api="https://ghcr.io/v2/${repo}"
        else
          repo="${name#docker.io/}"; repo="${repo#index.docker.io/}"
          [[ "$repo" == */* ]] || repo="library/${repo}"
          auth="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull"
          api="https://registry-1.docker.io/v2/${repo}"
        fi
        token=$(curl -fsS -u "${REGISTRY_USER}:${REGISTRY_PASSWORD}" "$auth" | jq -r .token)
        digest=$(curl -fsSI -H "Authorization: Bearer ${token}" \
          -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
          "${api}/manifests/${tag}" \
          | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
        [[ "$digest" == sha256:* ]] || { echo "no digest for ${ref}" >&2; exit 1; }
        echo "Pushed ${ref}@${digest}"
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Remove DevOps checkout
      if: always() && inputs.kubernetes-mode == 'true'
      shell: bash
      run: rm -rf "$GITHUB_WORKSPACE/.devops"
