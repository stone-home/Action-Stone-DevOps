name: Super Linter
description: "Run Super-Linter with the job's own github.token. Holds no 1Password secret"
inputs:
  python:
    description: "To enable python-relevant linter, default 'false'"
    required: false
    default: "false"
  javascript:
    description: "To enable javascript-relevant linter, default 'false'"
    required: false
    default: "false"
  latex:
    description: "To enable LaTex Project linter, default 'false'"
    required: false
    default: "false"
  exclude:
    description: "A Regex expression of exclusion files"
    required: false
    default: "^test/"
  github-token-path:
    description: "Deprecated and unused. The linter reports status with the job's own github.token"
    required: false
    default: ""
  onepass-token:
    description: "Deprecated and unused. The linter no longer reads anything from 1Password"
    required: false
  kubernetes-mode:
    description: "enable kubernetes mode, meaning that this action run on a host with ARC kubernetes mode"
    required: false
    default: "false"

# ===========================================================================
# Required Permission
# permissions:
#  contents: read
#  packages: read
# To report GitHub Actions status checks
#  statuses: write
# ===========================================================================
# Use "ghcr.io/super-linter/super-linter:v8.5.0" when kubernetes-mode is true"

runs:
  using: "composite"
  steps:
    # No 1Password here on purpose: linters run configuration taken from the
    # repository being linted (an ESLint config is executable code), so this
    # action holds no secret beyond the job's own short-lived github.token.
    - name: Regular linter (Docker action)
      uses: super-linter/super-linter/slim@v8.5.0
      if: ${{ inputs.kubernetes-mode != 'true' }}
      env:
        # To report GitHub Actions status checks
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_YAML: true
        VALIDATE_JSON: true
        VALIDATE_JSON_PRETTIER: true
        VALIDATE_GITLEAKS: true
        VALIDATE_ENV: true
        VALIDATE_DOCKERFILE_HADOLINT: true
        VALIDATE_GIT_COMMITLINT: true
        VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
    - name: Regular linter (linter.sh)
      if: ${{ inputs.kubernetes-mode == 'true' }}
      env:
        # To report GitHub Actions status checks
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_YAML: true
        VALIDATE_JSON: true
        VALIDATE_JSON_PRETTIER: true
        VALIDATE_GITLEAKS: true
        VALIDATE_ENV: true
        VALIDATE_DOCKERFILE_HADOLINT: true
        VALIDATE_GIT_COMMITLINT: true
        VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
      shell: bash
      run: /action/lib/linter.sh

    # ---------- Python ----------
    - name: Python Linter (Docker action)
      if: ${{ inputs.kubernetes-mode != 'true' && inputs.python == 'true' }}
      uses: super-linter/super-linter/slim@v8.5.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_PYTHON_BLACK: true
        VALIDATE_JUPYTER_NBQA_BLACK: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
    - name: Python Linter (linter.sh)
      if: ${{ inputs.kubernetes-mode == 'true' && inputs.python == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_PYTHON_BLACK: true
        VALIDATE_JUPYTER_NBQA_BLACK: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
      run: /action/lib/linter.sh

    # ---------- JavaScript / TypeScript ----------
    - name: JavaScript Linting (Docker action)
      if: ${{ inputs.kubernetes-mode != 'true' && inputs.javascript == 'true' }}
      uses: super-linter/super-linter/slim@v8.5.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_JAVASCRIPT_ES: true
        VALIDATE_JAVASCRIPT_PRETTIER: true
        VALIDATE_TYPESCRIPT_ES: true
        VALIDATE_TYPESCRIPT_PRETTIER: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
    - name: JavaScript Linting (linter.sh)
      if: ${{ inputs.kubernetes-mode == 'true' && inputs.javascript == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_JAVASCRIPT_ES: true
        VALIDATE_JAVASCRIPT_PRETTIER: true
        VALIDATE_TYPESCRIPT_ES: true
        VALIDATE_TYPESCRIPT_PRETTIER: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
      run: /action/lib/linter.sh

    # ---------- LaTeX ----------
    - name: LaTeX Linting (Docker action)
      if: ${{ inputs.kubernetes-mode != 'true' && inputs.latex == 'true' }}
      uses: super-linter/super-linter/slim@v8.5.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_LATEX: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
    - name: LaTeX Linting (linter.sh)
      if: ${{ inputs.kubernetes-mode == 'true' && inputs.latex == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VALIDATE_LATEX: true
        VALIDATE_ALL_CODEBASE: false
        FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
      run: /action/lib/linter.sh
