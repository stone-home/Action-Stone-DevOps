name: "Setup 1Password"
description: "Installs the 1Password CLI in kubernetes mode. Does not export the service account token"

# This action no longer exports OP_SERVICE_ACCOUNT_TOKEN to the job. The token
# is passed to load-github-token, which sets it on the one step that reads the
# secret. On a normal runner this action therefore has nothing to do.
inputs:
  onepass-token:
    description: "Deprecated and unused. Pass the token to load-github-token instead"
    required: false
  kubernetes-mode:
    description: "enable kubernetes mode, meaning that this action run on a host with ARC kubernetes mode"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Ensure unzip and CA certificates (check first, install if missing)
      shell: bash
      if: ${{ inputs.kubernetes-mode == 'true' }}
      run: |
        set -euo pipefail
        has_ca_bundle() {
        [ -s /etc/ssl/certs/ca-certificates.crt ] || [ -s /etc/ssl/cert.pem ]
        }

        need_install=0
        if ! command -v unzip >/dev/null 2>&1; then
        need_install=1
        fi
        if ! has_ca_bundle; then
        need_install=1
        fi

        if [ "$need_install" -eq 1 ]; then
        if command -v apk >/dev/null 2>&1; then
         apk add --no-cache unzip ca-certificates
         update-ca-certificates || true
        elif command -v apt-get >/dev/null 2>&1; then
         apt-get update
         DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unzip ca-certificates
         update-ca-certificates
        else
         echo "Neither apk nor apt-get found; use a Debian/Ubuntu or Alpine-based container." >&2
         exit 1
        fi
        fi

        if ! has_ca_bundle; then
        echo "CA bundle not found after installation." >&2
        exit 1
        fi
        if ! command -v unzip >/dev/null 2>&1; then
        echo "unzip not found after installation." >&2
        exit 1
        fi

    - name: Install 1Password CLI
      if: ${{ inputs.kubernetes-mode == 'true' }}
      uses: 1password/install-cli-action@v2
