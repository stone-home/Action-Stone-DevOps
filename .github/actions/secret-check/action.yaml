name: Workflow-Trufflehog
inputs:
  kubernetes-mode:
    description: "Whether to run in Kubernetes mode (ARC shell) or not (Docker action)."
    required: false
    default: "false"

# using container "ghcr.io/trufflesecurity/trufflehog:latest" when kubernetes-mode is true.
runs:
  using: composite
  steps:
    - name: Secret Scanning (Docker action)
      if: ${{ inputs.kubernetes-mode != 'true' }}
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --results=verified,unknown

    - name: Secret Scanning (ARC/k8s shell)
      if: ${{ inputs.kubernetes-mode == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        git config --global --add safe.directory '*'
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        if ! command -v trufflehog >/dev/null 2>&1; then
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git ca-certificates curl tar
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl tar
          fi
          ver="${TH_TAG#v}"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) th_arch=amd64 ;;
            aarch64) th_arch=arm64 ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          url="https://github.com/trufflesecurity/trufflehog/releases/download/${TH_TAG}/trufflehog_${ver}_linux_${th_arch}.tar.gz"
          curl -fsSL -o /tmp/trufflehog.tgz "$url"
          tar -xzf /tmp/trufflehog.tgz -C /tmp trufflehog
          install -m 0755 /tmp/trufflehog /usr/local/bin/trufflehog
          rm -f /tmp/trufflehog.tgz /tmp/trufflehog
        fi
        trufflehog git "file://$GITHUB_WORKSPACE" --results=verified,unknown
