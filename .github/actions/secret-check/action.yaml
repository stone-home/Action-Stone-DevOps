name: Workflow-Trufflehog
inputs:
  kubernetes-mode:
    description: "Whether to run in Kubernetes mode (ARC shell) or not (Docker action)."
    required: false
    default: "false"

# One scanner version for both paths. To upgrade, change all of these together:
# the action commit and `version` below, and TH_TAG plus both checksums in the
# kubernetes step (from trufflehog_<version>_checksums.txt on the release page).
runs:
  using: composite
  steps:
    # The action adds --fail itself, so it is not repeated in extra_args.
    - name: Secret Scanning (Docker action)
      if: ${{ inputs.kubernetes-mode != 'true' }}
      uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
      with:
        version: "3.100.0"
        extra_args: --results=verified,unknown

    - name: Secret Scanning (ARC/k8s shell)
      if: ${{ inputs.kubernetes-mode == 'true' }}
      shell: bash
      env:
        TH_TAG: v3.100.0
        TH_SHA256_AMD64: b2d85eba59865e98f45c9fc9f77d2c6d62df529fdd5755af121304ea5a7cecbb
        TH_SHA256_ARM64: aa61657049229ae523e8455fcbba87dff57b0a2ba6bdb391a38cf75e6d4016dd
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        ver="${TH_TAG#v}"
        # Install the pinned version unless that exact version is already there.
        if ! trufflehog --version 2>&1 | grep -qF " ${ver}"; then
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git ca-certificates curl tar
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl tar
          fi
          arch="$(uname -m)"
          case "$arch" in
            x86_64) th_arch=amd64; th_sha="$TH_SHA256_AMD64" ;;
            aarch64) th_arch=arm64; th_sha="$TH_SHA256_ARM64" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          url="https://github.com/trufflesecurity/trufflehog/releases/download/${TH_TAG}/trufflehog_${ver}_linux_${th_arch}.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/trufflehog.tgz" "$url"
          # Refuse a download that does not match the pinned checksum.
          echo "${th_sha}  $tmp/trufflehog.tgz" | sha256sum -c -
          tar -xzf "$tmp/trufflehog.tgz" -C "$tmp" trufflehog
          install -m 0755 "$tmp/trufflehog" /usr/local/bin/trufflehog
          rm -rf "$tmp"
        fi
        # --fail: exit non-zero when a secret is found. Without it the scan
        # reports findings and still passes.
        trufflehog git "file://$GITHUB_WORKSPACE" --results=verified,unknown --fail --no-update
