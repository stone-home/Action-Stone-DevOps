name: Workflow-PyPi Publish

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
        default: "3.11"
      poetry-version:
        required: true
        type: string
        default: "1.8.5"
      version-id:
        required: true
        type: string
    secrets:
      onepass_token:
        required: true
        description: "A access-token for 1password authorsation"

# contents: write is needed because the release branch and the version bump are
# pushed with the job token that actions/checkout stored.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 2. Set up Python environment
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      # 3. Run poetry image
      - name: Install poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
        with:
          poetry-version: ${{ inputs.poetry-version }}
      # 4. Setup a local virtual environment (if no poetry.toml file)
      - name: Setup a local virtual environment (if no poetry.toml file)
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      # 5. Cache the virtual environment based on the dependencies lock file
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
      # 6. load Secrets from 1password
      # The service account token is set on this step only, and the secrets
      # are returned as step outputs instead of job-wide environment variables.
      - name: Load credentials
        id: load-credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.onepass_token }}
          GITHUB_TOKEN: "op://DevOps/Git PAT - StoneHome - Action/credential"
          PYPI_TOKEN: "op://DevOps/PyPi Token/credential"

      # 7. create a branch
      - name: Create Release Branch
        shell: bash
        env:
          # Read as "$VERSION_ID", never expanded into the script.
          VERSION_ID: ${{ inputs.version-id }}
        run: |
          BRANCH_NAME="versions/${VERSION_ID}"
          git config user.name "Publish Action"
          git config user.email "github@stone-bo.com"
          git checkout -b "$BRANCH_NAME"
          git push --set-upstream origin "$BRANCH_NAME"
          echo "Created branch: $BRANCH_NAME"
      # 8. Update version in pyproject.toml to match the tag version
      - name: Update version in pyproject.toml
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version-id }}
        run: |
          NEW_VERSION="${VERSION_ID#v}" # Remove 'v' prefix if it exists
          poetry version "$NEW_VERSION"
          git add pyproject.toml
          git commit -m "chore(poetry): bumping the version to ${VERSION_ID}"
          git push
      # 9. Build package
      - name: Build package
        run: poetry build
      # 10. Publish the package
      # Poetry reads the PyPI token from POETRY_PYPI_TOKEN_PYPI, so it is not
      # placed on the command line.
      - name: Publish package to PyPI
        run: poetry publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ steps.load-credentials.outputs.PYPI_TOKEN }}
