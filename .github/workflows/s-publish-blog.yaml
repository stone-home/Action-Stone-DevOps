name: Publish Release Blog

on:
  release:
    types: [published]

# The job token is read-only here. Everything that writes uses a token read
# from 1Password, so the job's own token never needs more than this.
permissions:
  contents: read

jobs:
  blog-creating:
    # runs-on: ubuntu-latest
    runs-on: arc-runner-large
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/create-blog-in-hugo
        with:
          release-subject: ${{ github.event.release.name }} # Subject of the release
          release-body: ${{ github.event.release.body }} # Body of the release
          release-url: ${{ github.event.release.html_url }} # URL of the release
          python-version: "3.12.9" # Python version to use
          project-name: "DevOps Automation"
          onepass-token: ${{ secrets.OP_ACCOUNT_TOKEN }} # 1Password service account token
          kubernetes-mode: "true"
