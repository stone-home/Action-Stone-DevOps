name: Workflow - Comprehensive Gateway of Release
on:
  workflow_call:
    inputs:
      default-branch:
        required: false
        type: string
        default: "trunk"
        description: "Set the default branch you want to checkout with"
      run-on:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "The OS to run the release workflow on. Default to ubuntu-latest."
      python-project:
        required: false
        type: boolean
        default: false
      nodejs-project:
        required: false
        type: boolean
        default: false
      latex-project:
        required: false
        type: boolean
        default: false
      git-token-path:
        required: false
        type: string
        default: "op://DevOps/Git PAT - StoneHome - Action/credential"
      nodejs-version:
        required: false
        type: string
        default: "24"
        description: "The version of NodeJS"
      python-version:
        required: false
        type: string
        default: "3.12"
        description: "THe version of Python"
      poetry-version:
        required: false
        type: string
        default: "2.5.1"
        description: "The version of Poetry"
      version-id:
        description: "This value is only used when publish is required"
        required: false
        type: string
      pypi-enable:
        description: "Feature only work when python-project is true"
        required: false
        type: boolean
        default: false
      pypi-token-path:
        description: "Feature only work when python-project is true"
        required: false
        type: string
        default: "op://DevOps/PyPi Token/credential"
      kubernetes-mode:
        description: "enable kubernetes mode, meaning that this action run on a host with ARC kubernetes mode"
        required: false
        type: boolean
        default: false
      docker-push:
        description: "Build and push Docker image to GHCR or Docker Hub"
        required: false
        type: boolean
        default: false
      docker-registry:
        description: "Target registry: 'ghcr' or 'dockerhub'"
        required: false
        type: string
        default: "ghcr"
      docker-hub-username:
        description: "Docker Hub username (required when docker-registry is dockerhub)"
        required: false
        type: string
        default: ""
      docker-hub-password-path:
        description: "1Password secret path for Docker Hub token (required when docker-registry is dockerhub)"
        required: false
        type: string
        default: ""
      docker-image-name:
        description: "Full image name (e.g. ghcr.io/owner/repo or username/repo for Docker Hub). Defaults by registry"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      docker-context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      docker-tags:
        description: "Comma-separated tags to push (e.g. latest,v1.0.0). Can use version-id when set"
        required: false
        type: string
        default: "latest"
    secrets:
      onepass-token:
        description: "A access-token for 1password authorsation"
        required: true

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # Required for OIDC/Trusted Publishing
jobs:
  python-publish:
    name: Publish Python Project to PyPi
    if: inputs.python-project
    runs-on: ${{ inputs.run-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      - uses: stone-home/Action-Stone-DevOps/.github/actions/publish-python@trunk
        with:
          onepass-token: ${{ secrets.onepass-token }}
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}
          version-id: ${{ inputs.version-id || env.RELEASE_VERSION || github.ref_name }}
          github-token-path: ${{ inputs.git-token-path }}
          pypi-enable: ${{ inputs.pypi-enable }}
          pypi-token-path: ${{ inputs.pypi-token-path }}
          kubernetes-mode: ${{ inputs.kubernetes-mode }}
  js:
    name: Release Project to GitHub Rlease in NPM environment
    if: inputs.nodejs-project
    runs-on: ${{ inputs.run-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      - uses: stone-home/Action-Stone-DevOps/.github/actions/publish-npm@trunk
        with:
          node-version: ${{ inputs.nodejs-version }}
          github-token-path: ${{ inputs.git-token-path }}
          onepass-token: ${{ secrets.onepass-token }}
          kubernetes-mode: ${{ inputs.kubernetes-mode }}
  latex:
    name: Release Project to GitHub Rlease for LaTex Documents
    if: inputs.latex-project
    runs-on: ${{ inputs.run-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      - uses: stone-home/Action-Stone-DevOps/.github/actions/publish-latex@trunk
        with:
          node-version: ${{ inputs.nodejs-version }}
          github-token-path: ${{ inputs.git-token-path }}
          onepass-token: ${{ secrets.onepass-token }}
          kubernetes-mode: ${{ inputs.kubernetes-mode }}
  docker-push:
    name: Build and Push Docker Image
    if: inputs.docker-push
    runs-on: ${{ inputs.run-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      - uses: stone-home/Action-Stone-DevOps/.github/actions/docker-push@trunk
        with:
          registry: ${{ inputs.docker-registry }}
          registry-username: ${{ inputs.docker-hub-username }}
          registry-password-path: ${{ inputs.docker-hub-password-path }}
          onepass-token: ${{ secrets.onepass-token }}
          kubernetes-mode: ${{ inputs.kubernetes-mode }}
          image-name: ${{ inputs.docker-image-name }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.docker-context }}
          tags: ${{ inputs.docker-tags }}
  basic-github-release:
    name: Basic Release Process
    if: inputs.python-project == false && inputs.nodejs-project == false && inputs.latex-project == false && inputs.docker-push == false
    runs-on: ${{ inputs.run-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      - uses: stone-home/Action-Stone-DevOps/.github/actions/publish-basic@trunk
        with:
          github-token-path: ${{ inputs.git-token-path }}
          onepass-token: ${{ secrets.onepass-token }}
          kubernetes-mode: ${{ inputs.kubernetes-mode }}
