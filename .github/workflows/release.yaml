name: Workflow-Release
on:
  workflow_call:
    inputs:
      nodejs_project:
        required: false
        type: boolean
        default: false
      latex_project:
        required: false
        type: boolean
        default: false
      git_token_path:
        required: false
        type: string
        default: "op://DevOps/Git PAT - StoneHome - Action/credential"
    secrets:
      onepass_token:
        description: "A access-token for 1password authorsation"
        required: true

permissions:
  contents: read # for checkout
jobs:
  release:
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The service account token is set on this step only, so npm ci and the
      # build below cannot read it.
      - name: Load GitHub credentials
        id: load-credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.onepass_token }}
          GITHUB_TOKEN: ${{ inputs.git_token_path }}

      - name: Cache TeX Live installation
        id: cache-texlive
        if: ${{ inputs.latex_project }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-texlive-latest
          path: /usr/local/texlive

      # Install TeX Live everytime to restore soft links' issues after loading cache
      - name: Install TeX Live
        if: ${{ inputs.latex_project}}
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Node.js install dependencies
        if: ${{ inputs.nodejs_project }}
        run: npm ci
      - name: Node.js Build
        if: ${{ inputs.nodejs_project }}
        run: npm run build

      # Same pinned toolchain as the publish-* actions; nothing is downloaded
      # at release time beyond what that action pins.
      - name: Install Semantic Release
        uses: stone-home/Action-Stone-DevOps/.github/actions/install-semantic-release@trunk

      - run: npx --no-install semantic-release
        name: create a new release page and tag
        env:
          GITHUB_TOKEN: ${{ steps.load-credentials.outputs.GITHUB_TOKEN }}
