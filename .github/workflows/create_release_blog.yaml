name: Workflow-Release Blog

on:
  workflow_call:
    inputs:
      release-subject:
        required: true
        type: string
      release-body:
        required: true
        type: string
      release-url:
        required: true
        type: string
      python-version:
        required: true
        type: string
        default: "3.11"
      project-name:
        required: true
        type: string
      hero-image:
        required: false
        type: string
        default: "/images/posts/hero/project-release.jpeg"

    secrets:
      onepass_token:
        description: "A access-token for 1password authorsation"
        required: true

jobs:
  blog-creating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch release information
        id: release
        run: |
          echo "RELEASE_SUBJECT=${{ inputs.release-subject }}" >> $GITHUB_ENV
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "${{ inputs.release-body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "RELEASE_URL=${{ inputs.release-url }}" >> $GITHUB_ENV

      # The service account token is set on this step only, and the PAT is
      # returned as a step output, so pip install below sees neither.
      - name: Load GitHub credentials
        id: load-credentials
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.onepass_token }}
          GITHUB_TOKEN: "op://DevOps/Git PAT - Personal - GitHub Action/credential"

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: stonebo/stone-journey.github.io
          token: ${{ steps.load-credentials.outputs.GITHUB_TOKEN }}
          path: hugo_blog
          ref: trunk

      - name: Checkout DevOps repository
        uses: actions/checkout@v6
        with:
          repository: stone-home/Action-Stone-DevOps
          token: ${{ steps.load-credentials.outputs.GITHUB_TOKEN }}
          path: devops_repo
          ref: trunk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependency and generate new file
        run: |
          export PYTHONPATH="${PYTHONPATH}:${{ github.workspace }}"
          python -m pip install --upgrade pip
          pip install ures
          python devops_repo/scripts/release_blog.py -p "${{ inputs.project-name }}" -v "${{ env.RELEASE_SUBJECT }}" -n "${{ env.RELEASE_BODY }}" -u "${{ env.RELEASE_URL }}" -o "hugo_blog" --hero "${{ inputs.hero-image}}"

      - name: Commit changes
        run: |
          cd hugo_blog
          git config --global user.email "github@stone-bo.com"
          git config --global user.name "Blog Creation Bot"
          git add ./content/posts/project
          git commit -m "docs(project): add new blog for ${{ env.RELEASE_SUBJECT }} of ${{ inputs.project-name }}"
          git push
        env:
          GITHUB_TOKEN: ${{ steps.load-credentials.outputs.GITHUB_TOKEN }}
