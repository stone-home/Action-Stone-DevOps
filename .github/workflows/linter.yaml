name: Workflow-Super Linter

on:
  workflow_call:
    inputs:
      python:
        required: false
        type: boolean
        default: false
      exclude:
        required: false
        type: string
        default: "^test/"
    secrets:
      onepass_token:
        description: "Deprecated and unused. The linter no longer reads anything from 1Password"
        required: false

jobs:
  superLint:
    name: Liters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
      - name: Cache Super-Linter data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/super-linter-cache
          key: ${{ runner.os }}-docker-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # No 1Password here on purpose: linters run configuration taken from the
      # repository being linted, so this job holds only its own github.token.
      - name: Regular linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_GITLEAKS: true
          VALIDATE_ENV: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GIT_COMMITLINT: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}

      - name: Python Linter
        if: ${{ inputs.python }}
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_JUPYTER_NBQA_BLACK: true
          FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
